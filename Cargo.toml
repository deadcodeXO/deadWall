[package]
name = "deadwall"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A desktop network monitor and application firewall"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "persistence", "glow", "wgpu", "wayland", "x11"] }
egui_plot = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
etherparse = "0.19"
if-addrs = "0.14"

libloading = "0.8"
sysinfo = { version = "0.37", default-features = false, features = ["network", "system"] }
csv = "1.4"
getrandom = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_NetworkManagement_WiFi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_Rpc", "Win32_Security", "Win32_NetworkManagement_WindowsFilteringPlatform"] }

windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_NetworkManagement_WindowsFirewall"] }

wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }




[build-dependencies]
winresource = "0.1"

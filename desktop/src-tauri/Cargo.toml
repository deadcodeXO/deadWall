[package]
name = "deadwall-tauri"
version = "0.1.0"
edition = "2024"
autolib = false
description = "deadWall local network monitor and firewall"
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
etherparse = "0.19"
if-addrs = "0.14"

libloading = "0.8"
sysinfo = { version = "0.37", default-features = false, features = ["network", "system"] }
csv = "1.4"
getrandom = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_NetworkManagement_WiFi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_Rpc", "Win32_Security", "Win32_NetworkManagement_WindowsFilteringPlatform"] }

windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_NetworkManagement_WindowsFirewall"] }






[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
